<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}.seal{border:1px solid #d5dde5;border-radius:8px;padding:.8rem;margin:.6rem 0}.seal b{font-size:1.05rem}.seal ul{margin:.4rem 0;padding-left:1.2rem}.frozen{color:#8a1f11}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案</p><p>异常值比控制阈值越高，缺陷优先级越高；应急处置缺陷必须完成复检并记录证据后才能关闭。</p><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><h2>审计封存</h2><p>审计链断链时冻结缺陷建单与流转，并生成未结束处置单（断点、发现人、原因、证据摘要）；另一名应急经理确认影响范围后原事件保留为只读，处置单结清才恢复写入并追加恢复说明。</p><button onclick="verifyChain()">校验审计链</button> <button onclick="loadSeals()">刷新处置单</button><pre id="verify"></pre><div id="seals"></div><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
async function verifyChain(){const r=await fetch('/api/audit/verify',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('verify').textContent=JSON.stringify(await r.json(),null,2)}
async function loadSeals(){const r=await fetch('/api/seals',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const d=await r.json();document.getElementById('seals').innerHTML=(d.seals||[]).map(renderSeal).join('')||'<p>暂无封存处置单。</p>'}
function renderSeal(s){const frozen=(s.frozen_items||[]).map(i=>'#'+i.id+' '+i.title+'（'+i.status+'）').join('，')||'无';const prog=(s.progress||[]).map(p=>'<li>'+(p.done?'✅':'⬜')+' '+p.label+(p.actor?' — '+p.actor:'')+(p.at?' @ '+p.at:'')+'</li>').join('');return '<div class="seal"><b>处置单 #'+s.id+'</b> 状态：'+s.status+' ｜ 断点事件：#'+s.broken_event_id+' ｜ 发现人：'+s.discovered_by+'<br><span class="frozen">冻结项：'+frozen+'</span><ul>'+prog+'</ul></div>'}
loadSeals();</script></body></html>
