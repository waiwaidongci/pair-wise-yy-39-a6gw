<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大坝巡检、缺陷与应急管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>大坝巡检、缺陷与应急管理</h1><p>安排巡检，记录渗流、位移、裂缝等缺陷并跟踪修复、复检和应急预案</p><p>异常值比控制阈值越高，缺陷优先级越高；应急处置缺陷必须完成复检并记录证据后才能关闭。</p><button onclick="loadItems()">刷新列表</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><h2>审计封存</h2><p>审计链断链时冻结相关缺陷的后续写入并建处置单；另一名应急经理确认影响范围后原事件保持只读，处置单结清才恢复写入。</p><button onclick="loadSeals()">刷新封存状态</button><pre id="seals">尚未加载封存状态。</pre><script>async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const d=await r.json();const lines=(d.items||[]).map(i=>`#${i.id} ${i.title} [${i.status}] 优先级:${i.priority}${i.frozen?' 【已冻结】':''}`);document.getElementById('out').textContent=lines.join('\n')||'暂无缺陷。'}async function loadSeals(){const r=await fetch('/api/seal-cases',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const d=await r.json();const lines=(d.cases||[]).map(c=>{const frozen=(c.frozen_items||[]).join(',')||'无';return `#${c.id} 进度:${c.progress.label}(${c.progress.step}/${c.progress.total}) 断点事件:${c.break_event_id} 发现人:${c.discovered_by} 冻结缺陷:${frozen} 原因:${c.reason}`});document.getElementById('seals').textContent=lines.join('\n')||'当前没有封存处置单。'}</script></body></html>
